name: CI

on:
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-test:
        runs-on: xcode-27
        steps:
            - uses: actions/checkout@v4
            - name: Build
              run: swift build --build-system native
            - name: Test
              run: swift test --build-system native
